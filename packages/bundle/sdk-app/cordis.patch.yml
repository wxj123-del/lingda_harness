# The SDK application over dsh-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# SDK callers cannot use the interactive mode selector. Root Sessions start
# with the full execution policy so every composed automation tool is usable.
# Keep the policy overrides aligned with the base row because a patch replaces
# the complete plugin config.
- id: personal-agent
  config:
    defaultMode: execution
    modes:
      research:
        maxSteps: 20
      coding:
        maxSteps: 60
      execution:
        maxSteps: 40

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"
