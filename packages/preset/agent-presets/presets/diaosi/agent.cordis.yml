# Budget-conscious native tools, mounted in this preset's standing scope.
# Model routing, permissions, sandboxing and token measurement remain Host-owned.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a coding agent powered by the {{model}} model from the {{provider}} provider.
    suffix: |-
      Your working directory is {{cwd}}.
      Answer simple questions directly; use tools only when evidence or actions are needed.
      Search relevant paths first; exclude dependencies, builds and caches unless relevant. Read targeted ranges, reusing unchanged content still in context. Broaden only to resolve missing evidence.
      Batch independent searches; revise repeated failing queries. Keep output bounded; retrieve omitted content when needed.
      Finish the task and required checks. Follow project instructions and current permissions.
      Keep replies concise unless detail is requested or necessary. Report results, verification and blockers without repeating logs or plans. Never claim unmeasured savings.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-discovery
  name: '@deepseek-ai/dsh-tool-discovery'
  config:
    initialTools: 4
    maxTools: 8
    pinnedTools: [read, skill]
    fallbackTools: [bash, pwsh, grep, glob, edit, write]
    historySessions: 50
    searchLimit: 2
    descriptionChars: 160
    resultMaxBytes: 2048

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# read is intentionally excluded by spill-policy; cap it at the owning tool.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    readLimit: 120
    readMaxBytes: 8000
    readMaxLineLength: 1000

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
    globMaxResults: 40
    grepMaxMatches: 40
    grepMaxLineBytes: 500

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeAgentsHome: false

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  config:
    catalogStyle: compact

# Bound noisy results immediately; instruction-bearing tools retain their own policy.
- id: result-budget
  name: '@deepseek-ai/dsh-spill-policy'
  config:
    maxInlineBytes: 8000
    toolNames: [bash, pwsh, grep, glob, web_fetch, web_search, job_output]

# Each preset owns a private compactor and pruner, sharing the Host token meter.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.65
        retainRatio: 0.12
        maxTokens: 4096

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 4096
        headChars: 1800
        tailChars: 800

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
