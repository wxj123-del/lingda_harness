# Budget-conscious native tools, mounted in this preset's standing scope.
# Model routing, permissions, sandboxing and token measurement remain Host-owned.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a coding agent powered by the {{model}} model from the {{provider}} provider.
    suffix: |-
      Your working directory is {{cwd}}.
      Spend as few tokens and as little time as the task allows. Answer directly from what you know; one targeted read or command beats an exploration sweep, and anything already in context is reused rather than read or run again.
      Answer simple questions directly; use tools only when evidence or actions are needed.
      Search relevant paths first; exclude dependencies, builds and caches unless relevant. Read targeted ranges, reusing unchanged content still in context. Broaden only to resolve missing evidence.
      Batch independent searches; revise repeated failing queries. Keep output bounded; retrieve omitted content when needed.
      Finish the task and required checks. Follow project instructions and current permissions.
      Prefer static checks and the existing present tool for HTML/SVG previews. Do not launch headless browsers, GUI apps or pixel screenshots from bash unless the user explicitly asks for that verification. A Crashpad or GUI permission error is terminal for that check; switch to a static check instead of retrying it.
      Put commands expected to run longer than 10 seconds in the background, inspect them with job_output, and stop stalled or irrelevant jobs with job_kill. Do not poll with sleep or repeat a command that already timed out; use a smaller or static check and report partial results when a check is blocked. Set timeoutMs on foreground checks when a bounded result is sufficient.
      After creating or updating a deliverable file, call present before the final response so the user can open the current file.
      When a call is rejected, act on the reason it gave instead of retrying around it.
      Stop as soon as the question is answered or the requested change is complete. Keep replies concise unless detail is requested or necessary. Report results, verification and blockers without repeating logs or plans. Never claim unmeasured savings.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-discovery
  name: '@deepseek-ai/dsh-tool-discovery'
  config:
    initialTools: 4
    maxTools: 8
    pinnedTools: [read, skill, present]
    fallbackTools: [bash, pwsh, grep, glob, edit, write]
    recoveryTools: [read, grep, glob]
    historySessions: 50
    searchLimit: 2
    descriptionChars: 160
    resultMaxBytes: 2048
    decisionModel:
      url: http://127.0.0.1:8000
      timeoutMs: 500
      minConfidence: 0.7
      candidateLimit: 32

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  config:
    # Keep foreground checks from holding a turn indefinitely. Long work must use jobs.
    toolTimeoutMs: 30000
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# read is intentionally excluded by spill-policy; cap it at the owning tool.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    readLimit: 120
    readMaxBytes: 8000
    readMaxLineLength: 1000

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
    globMaxResults: 40
    grepMaxMatches: 40
    grepMaxLineBytes: 500

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeAgentsHome: false

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  config:
    catalogStyle: compact

# Bound noisy results immediately; instruction-bearing tools retain their own policy.
- id: result-budget
  name: '@deepseek-ai/dsh-spill-policy'
  config:
    maxInlineBytes: 8000
    toolNames: [bash, pwsh, grep, glob, web_fetch, web_search, job_output]

# Each preset owns a private compactor and pruner, sharing the Host token meter.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.65
        retainRatio: 0.12
        maxTokens: 4096

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 4096
        headChars: 1800
        tailChars: 800

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# The goal service and its round driver stay on the host plane, where the
# Gateway resolves them; this preset owns the human command and the
# model-facing tool. With one shipped preset left, `/goal` lives here rather
# than being gated by a preset roster.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: present
  name: '@deepseek-ai/dsh-tool-present'
